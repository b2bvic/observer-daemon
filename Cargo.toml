[package]
name = "observer-daemon"
version = "0.1.1"
edition = "2024"
description = "Behavioral validator daemon for Observer Protocol"
authors = ["Victor Valentine Romo <victor@scalewithsearch.com>"]

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
aho-corasick = "1"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
signal-hook = "0.3"
log = "0.4"
env_logger = "0.11"

[profile.release]
strip = true
lto = true
opt-level = "s"
